version: '3.8'

services:
  # Neo4j Knowledge Graph (Rule 3)
  neo4j:
    image: neo4j:5.9.0
    container_name: specter_neo4j
    environment:
      - NEO4J_AUTH=neo4j/test1234
    ports:
      - "7474:7474" # Browser UI
      - "7687:7687" # Bolt Protocol
    volumes:
      - neo4j_data:/data
    networks:
      - specter_airgap_net
    restart: unless-stopped

  # Backend FastAPI Engine (Rules 1, 2, 4)
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: specter_backend
    environment:
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=test1234
    ports:
      - "8000:8000"
    depends_on:
      - neo4j
    networks:
      - specter_airgap_net
    restart: unless-stopped

  # Frontend React Dashboard (Rule 5)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: specter_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - specter_airgap_net
    restart: unless-stopped

networks:
  # Isolated bridge network for internal microservice communication
  specter_airgap_net:
    driver: bridge

volumes:
  neo4j_data:
